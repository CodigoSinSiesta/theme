<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>HIMYA Micropíldora Orca</title>
<style>
  /* Identidad: Código Sin Siesta, sistema V4 (ver ../identidad/BRAND.md). Fondo pizarra, texto hueso, acento cielo,
     degradado solo en el texto destacado (.gr) y en barras; superficies de cristal con sombra tintada. */
  @font-face { font-family: 'Space Grotesk'; font-weight: 300 700; font-display: block; src: url(fonts/SpaceGrotesk.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 100 700; font-display: block; src: url(fonts/Plex.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; font-display: block; src: url(fonts/JetBrainsMono.woff2) format('woff2'); }
  :root { --navy: #0f172a; --navy2: #152033; --cyan: #60a5fa; --teal: #3b82f6; --blue: #1e3a8a; --pale: #cbd5e1; --pale3: #94a3b8;
          --ink: #FAF9F6; --red: #f87171; --amber: #fbbf24; --ok: #34d399;
          --grad: linear-gradient(90deg, #3b82f6 0%, #60a5fa 50%, #93c5fd 100%);
          --glass: rgba(30,58,138,.18); --line: rgba(96,165,250,.22); --shadow: 0 20px 60px rgba(10,22,40,.85);
          --mono: 'JetBrains Mono', monospace; --disp: 'Space Grotesk', sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); }
  body { font-family: 'IBM Plex Sans', sans-serif; color: var(--ink); }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #bg { position: absolute; inset: 0; background: var(--navy); }
  #bg::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(96,165,250,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(96,165,250,.045) 1px, transparent 1px); background-size: 60px 60px; background-position: var(--gp, 0 0); }
  #glow, #glow2 { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; filter: blur(40px);
          background: radial-gradient(circle, rgba(37,99,235,.30) 0%, rgba(37,99,235,0) 62%); }
  #glow2 { width: 900px; height: 900px; background: radial-gradient(circle, rgba(96,165,250,.16) 0%, rgba(96,165,250,0) 62%); }
  .abs { position: absolute; }
  .shot { position: absolute; inset: 0; opacity: 0; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .cy { color: var(--cyan); }
  .gr { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--cyan); }
  .mono { font-family: var(--mono); }

  /* ventana de captura */
  .win { position: absolute; border-radius: 18px; overflow: hidden; background: #0b1220;
         box-shadow: 0 30px 80px rgba(10,22,40,.9), 0 0 0 1.5px var(--line); }
  .cam { position: absolute; left: 0; top: 0; width: 1383px; height: 868px; transform-origin: 0 0; }
  .cam img { display: block; width: 1383px; height: 868px; }
  .hl { position: absolute; border-style: solid; border-color: var(--cyan); opacity: 0; }
  .cap { position: absolute; left: 50%; top: 1000px; transform: translateX(-50%); white-space: nowrap;
         background: rgba(15,23,42,.92); border: 1.5px solid var(--line); border-left: 6px solid var(--cyan);
         border-radius: 14px; padding: 14px 32px 14px 26px; font-size: 30px; font-weight: 500; box-shadow: var(--shadow); }
  .chip { position: absolute; transform: translate(-50%,-50%); white-space: nowrap; background: var(--navy);
          border: 2px solid var(--cyan); border-radius: 999px; padding: 14px 32px; font-family: var(--disp); font-size: 30px; font-weight: 700;
          box-shadow: 0 0 30px rgba(59,130,246,.3), var(--shadow); }
  .chip.warn { border-color: var(--amber); color: #fde68a; }

  /* tarjetas */
  .h2 { position: absolute; left: 0; width: 1920px; text-align: center; font-family: var(--disp); font-size: 64px; font-weight: 800; letter-spacing: -.02em; }
  .kick { font-family: var(--mono); text-transform: uppercase; letter-spacing: .16em; color: var(--cyan); font-weight: 600; font-size: 24px; }
  .kick.bar { display: flex; align-items: center; gap: 14px; }
  .kick.bar::before { content: ""; width: 36px; height: 3px; background: var(--cyan); flex: none; }
  .kick.eyebrow { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .kick.eyebrow::before { content: ""; width: 36px; height: 3px; background: var(--cyan); }
  .kick.eyebrow::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 16px var(--cyan); }
  .accent { position: absolute; left: 880px; width: 160px; height: 5px; border-radius: 3px; background: var(--grad); transform-origin: 50% 50%; }
  /* medidor de contexto */
  .ctx { position: absolute; left: 210px; width: 1500px; height: 96px; border-radius: 20px; border: 2px solid var(--line); background: rgba(15,23,42,.6); overflow: hidden; }
  .ctx i { position: absolute; top: 0; height: 100%; }
  .ctxpct { position: absolute; left: 1740px; font-family: var(--disp); font-size: 64px; font-weight: 800; letter-spacing: -.02em; width: 160px; }
  .ctxleg { position: absolute; display: flex; align-items: center; gap: 12px; font-size: 26px; color: var(--pale); white-space: nowrap; }
  .ctxleg b { width: 18px; height: 18px; border-radius: 5px; flex: none; }
  .ctxleg span { font-family: var(--mono); color: var(--pale3); font-size: 22px; }
  .cardrow { position: absolute; display: flex; align-items: stretch; }
  .card { position: absolute; border-radius: 24px; background: var(--glass); border: 1.5px solid var(--line); box-shadow: var(--shadow); padding: 38px 34px; }
  .card.cur { background: rgba(59,130,246,.16); box-shadow: 0 0 40px rgba(59,130,246,.22), var(--shadow); }
  .card.ok { border-color: rgba(52,211,153,.55); } .card.ok .k { color: var(--ok); }
  .card.bad { border-color: rgba(248,113,113,.55); } .card.bad .k { color: var(--red); }
  .vs { position: absolute; transform: translate(-50%,-50%); font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: .1em; color: var(--pale);
        background: var(--navy); border: 1.5px solid var(--line); border-radius: 999px; padding: 12px 24px; white-space: nowrap; z-index: 2; }
  .cardrow .card { position: relative; flex: 1 1 0; min-width: 0; box-sizing: border-box; overflow-wrap: break-word; }
  .cardrow.dense .card { padding: 38px 26px; }
  .cardrow.roomy .card { padding: 46px 40px; }
  .cardrow.roomy .card .k { font-size: 60px; }
  .cardrow.roomy .card .t { font-size: 46px; }
  .cardrow.roomy .card .d { font-size: 31px; }
  .cardrow.dense .card .t { font-size: 34px; }
  .cardrow.dense .card .d { font-size: 25px; }
  .card .k { font-family: var(--mono); font-size: 52px; font-weight: 700; color: var(--cyan); line-height: 1.1; margin-bottom: 22px; white-space: nowrap; }
  .card.neg .k { color: var(--red); }
  .card .t { font-family: var(--disp); font-size: 40px; font-weight: 800; line-height: 1.12; margin-bottom: 12px; letter-spacing: -.01em; }
  .card .d { font-size: 27px; font-weight: 400; color: var(--pale); line-height: 1.35; }
  .foot { position: absolute; left: 0; width: 1920px; text-align: center; font-size: 34px; color: var(--pale); }
  .foot b { color: var(--ink); }
  .big { position: absolute; left: 0; width: 1920px; text-align: center; font-family: var(--disp); font-size: 96px; font-weight: 800; line-height: 1.1; letter-spacing: -.03em; }
  .sub { position: absolute; left: 0; width: 1920px; text-align: center; font-size: 36px; color: var(--pale); font-weight: 400; }
  .side { position: absolute; left: 110px; top: 200px; width: 540px; height: 700px; }
  .side .k { font-family: var(--mono); font-size: 26px; font-weight: 600; color: var(--cyan); text-transform: uppercase; letter-spacing: .14em; margin-bottom: 40px; }
  .li { display: flex; align-items: flex-start; gap: 22px; font-family: var(--disp); font-size: 38px; font-weight: 700; line-height: 1.2; margin-bottom: 36px; }
  .li i { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--teal); color: var(--ink);
          font-style: normal; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: 2px; }

  /* terminal / código (como la terminal de la web) */
  .term { position: absolute; border-radius: 18px; background: #0b1220; border: 1.5px solid var(--line); box-shadow: 0 20px 60px rgba(10,22,40,.9); overflow: hidden; }
  .term .bar { height: 52px; background: rgba(30,58,138,.12); border-bottom: 1px solid rgba(96,165,250,.15); display: flex; align-items: center;
               padding: 0 22px; gap: 10px; font-family: var(--mono); font-size: 20px; color: var(--pale3); }
  .term .bar b { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .term pre { font-family: var(--mono); font-size: 30px; line-height: 1.6; padding: 28px 38px; color: var(--ink); white-space: pre; }
  .term pre .p { color: var(--cyan); }
  .fl { border-radius: 8px; padding: 0 4px; margin: 0 -4px; transition: none; }
  .legend { position: absolute; border-radius: 16px; background: var(--glass); border: 1.5px solid var(--line); padding: 22px 26px; box-shadow: var(--shadow); }
  .legend .f { font-family: var(--mono); font-size: 24px; color: var(--cyan); margin-bottom: 10px; overflow-wrap: anywhere; }
  .legend .m { font-size: 25px; color: var(--ink); line-height: 1.25; overflow-wrap: break-word; }

  /* diagramas */
  .node { position: absolute; border-radius: 20px; background: var(--glass); border: 1.5px solid var(--line); padding: 22px 28px; box-shadow: var(--shadow); }
  .node .n1 { font-family: var(--disp); font-size: 34px; font-weight: 800; }
  .node .n2 { font-family: var(--mono); font-size: 22px; color: var(--pale); margin-top: 8px; white-space: nowrap; }
  .node.nbig { padding: 40px 30px; }
  .node.nbig .n1 { font-size: 44px; }
  .node.nbig .n2 { font-size: 27px; white-space: normal; }
  .node.on { border-color: rgba(96,165,250,.7); background: rgba(59,130,246,.14); box-shadow: 0 0 36px rgba(59,130,246,.25), var(--shadow); }
  .node.bad { border-color: rgba(248,113,113,.6); }
  .node.ok { border-color: rgba(52,211,153,.55); }
  .tag { position: absolute; font-family: var(--mono); font-size: 24px; font-weight: 600; padding: 8px 18px; border-radius: 999px; white-space: nowrap; }
  svg.lines { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

  /* grafo de commits (git), columnas de estado (stages) y máquina de estados (states) */
  .gc { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--navy); border: 6px solid var(--cyan); }
  .gc.pending { border-style: dashed; }
  .gl { position: absolute; width: 300px; margin-left: -150px; text-align: center; font-size: 24px; line-height: 1.25; color: var(--pale); }
  .gl b { display: block; font-family: var(--mono); font-weight: 600; font-size: 26px; color: var(--ink); }
  .gtag { position: absolute; transform: translateY(-50%); font-family: var(--mono); font-size: 24px; font-weight: 700; padding: 7px 18px; border-radius: 999px;
          border: 2px solid var(--cyan); background: var(--navy); white-space: nowrap; box-shadow: var(--shadow); }
  .gtag small { display: block; font-size: 17px; font-weight: 500; color: var(--pale3); margin-top: 2px; }
  .ghead { position: absolute; transform: translate(-50%,-50%); font-family: var(--mono); font-size: 18px; font-weight: 700; letter-spacing: .12em; padding: 5px 14px;
           border-radius: 8px; background: var(--ink); color: var(--navy); white-space: nowrap; }
  .stok { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 24px var(--cyan), 0 0 56px rgba(96,165,250,.7); }
  .elab { position: absolute; transform: translate(-50%,-50%); font-family: var(--mono); font-size: 20px; color: var(--pale); background: rgba(15,23,42,.92); padding: 4px 12px; border-radius: 8px; white-space: nowrap; }
  .scol { position: absolute; border-radius: 24px; background: var(--glass); border: 1.5px solid var(--line); box-shadow: var(--shadow); }
  .scol .sh { padding: 26px 30px 0; font-family: var(--disp); font-size: 32px; font-weight: 800; letter-spacing: -.01em; }
  .scol .sd { padding: 4px 30px 0; font-family: var(--mono); font-size: 19px; color: var(--pale3); }
  .schip { position: absolute; height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 22px; border-radius: 14px; font-family: var(--mono); font-size: 24px; font-weight: 600;
           background: var(--navy); border: 2px solid rgba(203,213,225,.35); color: var(--ink); white-space: nowrap; box-shadow: var(--shadow); }
  .schip i { font-style: normal; font-weight: 800; }

  /* HUD: búho + marca + curso a la izquierda; capítulo a la derecha */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hudL { position: absolute; left: 56px; top: 30px; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  #hudL img { height: 40px; }
  #hudL .brand { font-family: var(--disp); font-size: 26px; font-weight: 700; color: var(--ink); }
  #hudL .brand b { color: var(--cyan); font-weight: 700; }
  #hudL .sep { width: 1.5px; height: 26px; background: rgba(96,165,250,.35); }
  #hudName { font-family: var(--mono); font-size: 19px; letter-spacing: .16em; text-transform: uppercase; color: var(--pale3); }
  #hudR { position: absolute; right: 56px; top: 40px; font-family: var(--mono); font-size: 20px; color: var(--pale); text-align: right; white-space: nowrap; }
  #hudR b { color: var(--cyan); font-weight: 700; margin-right: 12px; }
  #prog { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--grad); transform-origin: 0 50%; width: 1920px; }

  .wipe { position: absolute; top: -200px; height: 1480px; width: 2700px; }
  #wipeA { background: #0c1e4f; }
  #wipeB { background: var(--grad); }

  /* ── Tipos de plano alternativos a las tarjetas (versus, bars, spectrum, checklist, tree, cheat, radial, decision,
     figure, statusbar). Mismo lenguaje visual: cristal, acento cielo, degradado solo en lo destacado. */
  .vsHalf { position: absolute; top: 0; height: 1080px; width: 960px; }
  .vsHalf.r { left: 960px; background: rgba(30,58,138,.18); }
  .vsName { position: absolute; left: 140px; top: 230px; font-family: var(--disp); font-size: 150px; font-weight: 800; letter-spacing: -.04em; line-height: 1; white-space: nowrap; }
  .vsRowL { position: absolute; left: 146px; font-family: var(--mono); font-size: 22px; color: var(--pale3); letter-spacing: .14em; text-transform: uppercase; }
  .vsVal { position: absolute; left: 140px; width: 740px; font-family: var(--disp); font-size: 46px; font-weight: 700; line-height: 1.15; }
  .barRow { position: absolute; left: 0; width: 1920px; }
  .barLab { position: absolute; left: 0; width: 470px; text-align: right; font-family: var(--disp); font-size: 38px; font-weight: 700; line-height: 1.1; }
  .barLab small { display: block; font-family: 'IBM Plex Sans', sans-serif; font-size: 23px; font-weight: 400; color: var(--pale); margin-top: 4px; }
  .barFill { position: absolute; left: 500px; height: 78px; border-radius: 0 14px 14px 0; background: var(--glass); border: 1.5px solid var(--line); border-left: none; transform-origin: 0 50%; }
  .barFill.hot { background: rgba(59,130,246,.35); border-color: rgba(96,165,250,.7); box-shadow: 0 0 40px rgba(59,130,246,.25); }
  .barVal { position: absolute; font-family: var(--mono); font-size: 40px; font-weight: 700; color: var(--cyan); white-space: nowrap; }
  .barAxis { position: absolute; left: 500px; width: 2px; background: rgba(203,213,225,.35); }
  .specLine { position: absolute; left: 200px; width: 1520px; height: 10px; border-radius: 5px; transform-origin: 0 50%;
              background: linear-gradient(90deg, rgba(248,113,113,.75), #3b82f6 38%, #60a5fa 62%, rgba(248,113,113,.75)); }
  .specLine.mono { background: linear-gradient(90deg, #1e3a8a, #3b82f6 50%, #93c5fd); }
  .specMk { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--navy); border: 6px solid var(--cyan); }
  .specMk.good { width: 64px; height: 64px; margin: -32px 0 0 -32px; box-shadow: 0 0 30px rgba(96,165,250,.5); }
  .specMk.bad { border-color: var(--red); }
  .specMk.warn { border-color: #fbbf24; }
  .capMask { position: absolute; backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); background: rgba(15,23,42,.35); border-radius: 4px; }
  .specT { position: absolute; width: 440px; margin-left: -220px; text-align: center; }
  .specT .a { font-family: var(--disp); font-size: 40px; font-weight: 800; line-height: 1.1; } .specT .b { font-size: 26px; color: var(--pale); margin-top: 8px; line-height: 1.3; }
  .specEnd { position: absolute; font-family: var(--mono); font-size: 22px; color: var(--pale3); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .chkRow { position: absolute; left: 420px; display: flex; align-items: center; gap: 34px; font-family: var(--disp); font-size: 58px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
  .chkRow i { width: 72px; height: 72px; border-radius: 18px; border: 3px solid var(--line); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 44px; color: var(--navy); flex: none; }
  .chkRow i.on { background: var(--grad); border-color: transparent; box-shadow: 0 0 30px rgba(59,130,246,.35); }
  .chkRow small { font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; font-size: 28px; color: var(--pale); }
  .chkRow.off { color: rgba(250,249,246,.38); }
  .trLine { position: absolute; font-family: var(--mono); font-size: 34px; white-space: pre; color: var(--pale3); }
  .trLine .f { color: var(--ink); } .trLine.on .f { color: var(--cyan); font-weight: 700; }
  .trAnn { position: absolute; display: flex; align-items: baseline; gap: 18px; white-space: nowrap; }
  .trAnn .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 16px var(--cyan); flex: none; align-self: center; }
  .trAnn .a { font-family: var(--disp); font-size: 40px; font-weight: 800; } .trAnn .b { font-size: 26px; color: var(--pale); }
  .trAnn.note .dot { background: var(--pale3); box-shadow: none; }
  .chRow { position: absolute; left: 260px; width: 1400px; display: flex; align-items: baseline; padding: 20px 26px; border-radius: 16px; }
  .chRow.cur { background: var(--glass); box-shadow: inset 0 0 0 1.5px var(--line); }
  .chRow .c { width: 420px; flex: none; font-family: var(--mono); font-size: 46px; font-weight: 700; color: var(--cyan); white-space: nowrap; }
  .chRow .e { flex: 1 1 auto; min-width: 0; white-space: nowrap; font-family: var(--disp); font-size: 44px; font-weight: 700; } .chRow .e small { font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; font-size: 28px; color: var(--pale); margin-left: 16px; }
  .radC { position: absolute; width: 270px; height: 270px; margin: -135px 0 0 -135px; border-radius: 50%; background: rgba(59,130,246,.18); border: 2px solid rgba(96,165,250,.6);
          box-shadow: 0 0 60px rgba(59,130,246,.3); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--disp); font-size: 42px; font-weight: 800; text-align: center; }
  .radC small { font-family: var(--mono); font-size: 20px; color: var(--pale); font-weight: 500; letter-spacing: .1em; margin-top: 6px; }
  .radI { position: absolute; transform: translate(-50%,-50%); text-align: center; white-space: nowrap; }
  .radI .a { font-family: var(--mono); font-size: 32px; font-weight: 700; color: var(--cyan); } .radI .b { font-size: 24px; color: var(--pale); margin-top: 4px; }
  .decQ { position: absolute; left: 0; width: 1920px; top: 240px; text-align: center; font-family: var(--disp); font-size: 56px; font-weight: 800; letter-spacing: -.02em; }
  .decB { position: absolute; top: 520px; width: 460px; margin-left: -230px; text-align: center; }
  .decB .if { font-size: 30px; color: var(--pale); margin-bottom: 24px; line-height: 1.3; display: flex; align-items: flex-end; justify-content: center; }
  .decB .cmd { display: inline-block; font-family: var(--mono); font-size: 52px; font-weight: 700; background: var(--glass); border: 1.5px solid var(--line); border-radius: 18px; padding: 20px 38px; box-shadow: var(--shadow); white-space: nowrap; }
  .decB.cur .cmd { background: rgba(59,130,246,.22); border-color: rgba(96,165,250,.7); box-shadow: 0 0 40px rgba(59,130,246,.25), var(--shadow); }
  .figN { position: absolute; left: 0; width: 1920px; top: 290px; text-align: center; font-family: var(--disp); font-size: 300px; font-weight: 800; letter-spacing: -.05em; line-height: 1; white-space: nowrap; }
  .figU { position: absolute; left: 0; width: 1920px; top: 620px; text-align: center; font-size: 44px; color: var(--pale); }
  .figRow { position: absolute; left: 0; width: 1920px; top: 730px; display: flex; justify-content: center; gap: 60px; font-family: var(--mono); font-size: 32px; color: var(--pale3); white-space: nowrap; }
  .figRow b { color: var(--ink); }
  .sbBar { position: absolute; left: 160px; top: 440px; width: 1600px; height: 110px; border-radius: 20px; background: #0b1220; border: 1.5px solid var(--line); box-shadow: var(--shadow);

    o._b.style.top = (y0 + hk) + 'px'; o._bar.style.top = (y0 + hk + hb + 36) + 'px'; o._bar.style.display = hasS ? '' : 'none';
    o._s.style.top = (y0 + hk + hb + gap) + 'px';
  }
  if (o.type === 'versus') [o._na, o._nb].forEach(e => { let fs = 150; while (e.scrollWidth > 640 && fs > 70) { fs -= 6; e.style.fontSize = fs + 'px'; } if (fs < 150) e.style.top = (230 + Math.round((150 - fs) * .75)) + 'px'; });
  if (o.type === 'checklist') {   // bloque centrado en horizontal; si no cabe en 1680 px, se encoge la letra
    let w = Math.max(...o._rows.map(r => r.offsetWidth));
    if (w > 1680) { const k = 1680 / w; o._rows.forEach(r => { r.style.fontSize = 58 * k + 'px'; r.querySelectorAll('small').forEach(e => e.style.fontSize = 28 * Math.max(k, .85) + 'px'); }); w = Math.max(...o._rows.map(r => r.offsetWidth)); }
    o._rows.forEach(r => r.style.left = Math.max(120, Math.round((1920 - w) / 2)) + 'px');
  }
  if (o.type === 'cheat') {        // la columna de la tecla se ensancha hasta la clave más larga
    const cs = o._rows.map(r => r.querySelector('.c')), w = Math.max(...cs.map(e => e.scrollWidth));
    if (w > 390) { const cw = Math.min(900, w + 50); cs.forEach(e => e.style.width = cw + 'px'); cs.forEach(e => shrinkToFit(e, .6)); }
  }
  if (o.type === 'cheat') o._rows.forEach(r => {
    const e = r.querySelector('.e'), sm = e.querySelector('small'), over = () => e.scrollWidth > e.clientWidth + 1;
    let fs = 28; while (over() && sm && fs > 21) { fs -= 1; sm.style.fontSize = fs + 'px'; }
    let ft = 44; while (over() && ft > 34) { ft -= 1; e.style.fontSize = ft + 'px'; }

    if (right > 1860) { const lw = Math.max(...o._bars.map(b => b.v.offsetWidth)), W0 = Math.max(...o._bars.map(b => b.f.offsetWidth)), k = (1860 - 528 - lw) / W0;
      o._bars.forEach(b => { const w = Math.max(8, Math.round(b.f.offsetWidth * k)); b.f.style.width = w + 'px'; b.v.style.left = (528 + w) + 'px'; }); }
  }
  if (o.type === 'decision') {     // el comando no puede pisar al de al lado

    const ifs = o._br.map(b => b.querySelector('.if')), ih = Math.max(...ifs.map(e => e.offsetHeight)); ifs.forEach(e => e.style.minHeight = ih + 'px');
    let fm = 52; o._br.forEach(b => { const c = b.querySelector('.cmd'); let fs = 52; while (c.offsetWidth > gap && fs > 30) { fs -= 2; c.style.fontSize = fs + 'px'; } fm = Math.min(fm, fs); });
    o._br.forEach(b => b.querySelector('.cmd').style.fontSize = fm + 'px');   // todas las opciones al mismo tamaño
  }
  if (o.type === 'radial') { const sm = o._c.querySelector('small'); if (sm) { let fs = 20; while (sm.scrollWidth > 220 && fs > 13) { fs -= 1; sm.style.fontSize = fs + 'px'; sm.style.letterSpacing = '.05em'; } } }
  if (o.type === 'statusbar') o._call.forEach((e, i) => { const g = o._segs[o.items[i].seg].getBoundingClientRect(); e.style.left = Math.round(g.left + g.width / 2) + 'px'; });
  r.querySelectorAll('.card .k, .card .t, .card .d, .legend .f, .legend .m, .node .n1, .node .n2').forEach(e => shrinkToFit(e));
  if (o.type === 'code' && o._pre) {
    const pre = o._pre; shrinkToFit(pre, 0.6);
    if (pre.scrollWidth > pre.clientWidth + 1) { pre.style.whiteSpace = 'pre-wrap'; pre.style.overflowWrap = 'anywhere'; }
    const th = 52 + pre.scrollHeight; o._term.style.height = th + 'px';
    const lh = Math.max(0, ...o._leg.map(e => e.offsetHeight)), total = th + (lh ? 50 + lh : 0);
    const top = Math.max(120, Math.round((1080 - total) / 2) - 30);
    o._term.style.top = top + 'px'; o._leg.forEach(e => { e.style.top = (top + th + 50) + 'px'; });
  }
}
window.OVERFLOW = () => {
  const out = [];
  const inside = (a, b) => a.left >= b.left - 2 && a.right <= b.right + 2 && a.top >= b.top - 2 && a.bottom <= b.bottom + 2;
  FLAT.forEach(o => {
    if (o.type === 'tpl') o._el.querySelectorAll('.tpl *').forEach(e => {   // plantillas: nada fuera del encuadre ni recortado
      if (e.closest('svg') && e.tagName !== 'svg') return;
      const R = e.getBoundingClientRect(); if (!R.width || !R.height) return;
      const tx = (e.textContent || '').trim().slice(0, 40);
      if (R.right > 1920 + 2 || R.bottom > 1080 + 2 || R.left < -2) out.push(`${o._seg} tpl ${o.tpl}: «${tx}» fuera del encuadre`);
      if (!e.children.length && e.scrollWidth > e.clientWidth + 2 && getComputedStyle(e).overflow !== 'visible') out.push(`${o._seg} tpl ${o.tpl}: «${tx}» recortado`);
    });
    // plantillas: ningún texto se sale de su caja (.g), aunque se vea (overflow visible): se mide el texto, no el elemento
    if (o.type === 'tpl') o._el.querySelectorAll('.tpl .g').forEach(box => {
      const B = box.getBoundingClientRect(), w = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
      for (let n; (n = w.nextNode());) {
        if (!n.data.trim() || n.parentElement.closest('svg')) continue;
        const rg = document.createRange(); rg.selectNodeContents(n);
        if ([...rg.getClientRects()].some(R => R.width && !inside(R, B))) { out.push(`${o._seg} tpl ${o.tpl}: «${n.data.trim().slice(0, 40)}» se sale de su caja`); }
      }
    });
    o._el.querySelectorAll('.card, .legend, .term, .node:not(.g)').forEach(box => {
      const B = box.getBoundingClientRect();
      if (B.right > 1920 + 2 || B.bottom > 1080 + 2 || B.left < -2) out.push(`${o._seg} ${o.type}: caja fuera del encuadre`);
      box.querySelectorAll('*').forEach(e => {
        if (!e.textContent.trim() || e.children.length) return;
        const R = e.getBoundingClientRect(); if (!R.width) return;
        if (!inside(R, B) || e.scrollWidth > e.clientWidth + 1) out.push(`${o._seg} ${o.type}: «${e.textContent.trim().slice(0, 40)}» se sale de su caja`);
      });
    });
  });
  FLAT.filter(o => o.type === 'cheat').forEach(o => o._rows.forEach(r => { const e = r.querySelector('.e'); if (e.scrollWidth > e.clientWidth + 1) out.push(`${o._seg} cheat: «${e.textContent.trim().slice(0, 40)}» no cabe (acórtalo)`); }));
  return [...new Set(out)];
};
// Portada: título, subtítulo y lema van en una sola línea; si no caben en 1760 px, se encogen.
const fitTitle = () => ['tBig', 'tSub', 'tTag'].forEach(id => {
  const e = $(id), w0 = e.style.width; e.style.whiteSpace = 'nowrap'; e.style.width = 'max-content';
  const w = e.getBoundingClientRect().width; e.style.width = w0;
  if (w <= 1760) return;
  const f0 = parseFloat(getComputedStyle(e).fontSize), f = Math.floor(f0 * 1760 / w);
  e.style.fontSize = f + 'px';
  if (id === 'tBig') e.style.top = (parseFloat(e.style.top) + (f0 - f)) + 'px';   // mantiene la base del título pegada al subtítulo
});
window.ready = (async () => {
  await document.fonts.ready;
  fitTitle();
  FLAT.forEach(fitShot);
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  await Promise.all(FLAT.filter(o => o._frames).flatMap(o => o._frames.map(i => i.decode().catch(() => {}))));
})();
